[project]
name = "kinetograph"
version = "0.1.0a1"
description = "Autonomous Multi-Agent Video Orchestration Engine"
readme = {text = "Kinetograph desktop video editor backend", content-type = "text/plain"}
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # LLM & AI
    "langgraph>=0.4.1",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "aiosqlite>=0.20.0",
    "langchain-core>=0.3.0",
    "google-genai>=1.65.0",
    "elevenlabs>=1.20.0",

    # Subtitle-capable FFmpeg fallback when the system build lacks libass
    "imageio-ffmpeg>=0.6,<0.7",

    # Timeline export
    "opentimelineio>=0.17.0",

    # Web server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "websockets>=14.0",
    "python-multipart>=0.0.18",

    # CRDT (Yjs-compatible document sync)
    "pycrdt>=0.12.0",

    # HTTP client (Python-side)
    "httpx>=0.28.0",

    # Utilities
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "rich>=13.9.0",
    "watchfiles>=1.0.0",

    # Observability — OpenTelemetry traces/metrics exported to SigNoz (OTLP)
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8.0",
]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
kinetograph = "kinetograph.cli:main"

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
